# Local dev database. Isolates local runs from the prod Supabase Postgres so
# the prod worker never claims/processes runs you create on localhost.
# Storage still uses Supabase (see apps/api/.env SUPABASE_*).
#
#   docker compose up -d        # start
#   pnpm --filter api db:migrate   # apply schema
#   docker compose down         # stop (data persists in the named volume)
#   docker compose down -v      # stop + wipe data

services:
  db:
    image: postgres:16
    container_name: ugc-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ugc
    ports:
      - "5432:5432"
    volumes:
      - ugc-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ugc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ugc-dev-db:
