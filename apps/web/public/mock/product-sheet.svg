<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Mock product reference sheet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b29"/>
      <stop offset="1" stop-color="#12111b"/>
    </linearGradient>
    <linearGradient id="prod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#e164c4"/>
      <stop offset="1" stop-color="#56b6e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="48" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Product Reference Sheet</text>
  <rect x="48" y="92" width="220" height="6" rx="3" fill="url(#brand)"/>
  <g font-family="system-ui, sans-serif">
    <!-- 4 view cells -->
    <g>
      <rect x="48" y="140" width="528" height="330" rx="20" fill="#211f30" stroke="#3a3650" stroke-width="2"/>
      <rect x="250" y="200" width="124" height="210" rx="20" fill="url(#prod)"/>
      <ellipse cx="312" cy="200" rx="62" ry="22" fill="#c4b5fd"/>
      <text x="74" y="450" fill="#b9b4d0" font-size="22" font-weight="600">Front</text>
    </g>
    <g>
      <rect x="624" y="140" width="528" height="330" rx="20" fill="#211f30" stroke="#3a3650" stroke-width="2"/>
      <rect x="826" y="200" width="124" height="210" rx="20" fill="url(#prod)" transform="skewX(-6)"/>
      <text x="650" y="450" fill="#b9b4d0" font-size="22" font-weight="600">Three-quarter</text>
    </g>
    <g>
      <rect x="48" y="500" width="528" height="330" rx="20" fill="#211f30" stroke="#3a3650" stroke-width="2"/>
      <rect x="276" y="560" width="72" height="210" rx="16" fill="url(#prod)"/>
      <text x="74" y="810" fill="#b9b4d0" font-size="22" font-weight="600">Side</text>
    </g>
    <g>
      <rect x="624" y="500" width="528" height="330" rx="20" fill="#211f30" stroke="#3a3650" stroke-width="2"/>
      <rect x="826" y="560" width="124" height="210" rx="20" fill="#5b4bbf"/>
      <text x="650" y="810" fill="#b9b4d0" font-size="22" font-weight="600">Rear</text>
    </g>
  </g>
</svg>
