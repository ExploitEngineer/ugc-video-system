<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Mock storyboard sheet">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101622"/>
      <stop offset="1" stop-color="#0c0f17"/>
    </linearGradient>
    <linearGradient id="brand3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#e164c4"/>
      <stop offset="1" stop-color="#56b6e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg3)"/>
  <text x="48" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Storyboard / Keyframe Sheet</text>
  <rect x="48" y="92" width="220" height="6" rx="3" fill="url(#brand3)"/>
  <g font-family="system-ui, sans-serif">
    <!-- 6 scene cells in 3x2 -->
    <g>
      <rect x="48" y="140" width="352" height="320" rx="16" fill="#16202f" stroke="#27384f" stroke-width="2"/>
      <circle cx="140" cy="240" r="44" fill="#56b6e8" opacity="0.8"/>
      <rect x="80" y="360" width="180" height="14" rx="7" fill="#2c4763"/>
      <text x="70" y="180" fill="#8fb6d8" font-size="20" font-weight="700">Scene 1 · wide</text>
    </g>
    <g>
      <rect x="424" y="140" width="352" height="320" rx="16" fill="#16202f" stroke="#27384f" stroke-width="2"/>
      <rect x="520" y="210" width="120" height="120" rx="14" fill="#7c5cff" opacity="0.8"/>
      <text x="446" y="180" fill="#8fb6d8" font-size="20" font-weight="700">Scene 2 · push-in</text>
    </g>
    <g>
      <rect x="800" y="140" width="352" height="320" rx="16" fill="#16202f" stroke="#27384f" stroke-width="2"/>
      <polygon points="976,200 1040,320 912,320" fill="#e164c4" opacity="0.8"/>
      <text x="822" y="180" fill="#8fb6d8" font-size="20" font-weight="700">Scene 3 · low angle</text>
    </g>
    <g>
      <rect x="48" y="500" width="352" height="320" rx="16" fill="#16202f" stroke="#27384f" stroke-width="2"/>
      <circle cx="224" cy="640" r="60" fill="#56b6e8" opacity="0.7"/>
      <text x="70" y="540" fill="#8fb6d8" font-size="20" font-weight="700">Scene 4 · orbit</text>
    </g>
    <g>
      <rect x="424" y="500" width="352" height="320" rx="16" fill="#16202f" stroke="#27384f" stroke-width="2"/>
      <rect x="500" y="580" width="200" height="120" rx="14" fill="#7c5cff" opacity="0.7"/>
      <text x="446" y="540" fill="#8fb6d8" font-size="20" font-weight="700">Scene 5 · hero</text>
    </g>
    <g>
      <rect x="800" y="500" width="352" height="320" rx="16" fill="#16202f" stroke="#27384f" stroke-width="2"/>
      <rect x="900" y="560" width="152" height="200" rx="20" fill="#e164c4" opacity="0.7"/>
      <text x="822" y="540" fill="#8fb6d8" font-size="20" font-weight="700">Scene 6 · logo out</text>
    </g>
  </g>
</svg>
