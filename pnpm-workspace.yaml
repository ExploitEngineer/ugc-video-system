packages:
  - "apps/*"
  - "packages/*"

# Dependencies whose install/build scripts are allowed to run (pnpm >= 10).
# pnpm 11 requires the `allowBuilds` map (name -> true); `onlyBuiltDependencies`
# is kept for cross-version compatibility. Anything with a build script not
# allowed here is "ignored" and pnpm fails the install in CI — keep both lists
# complete and in sync.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  sharp: true
  ffmpeg-static: true

onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - sharp
  - ffmpeg-static

# Intentionally NOT built. @google/genai ships a prebuilt dist/ (its `prepare`
# script only rebuilds from source); protobufjs's postinstall is an optional
# compat check. Neither needs to run — listing them here silences the ignored-
# build check without granting either a build step.
ignoredBuiltDependencies:
  - unrs-resolver
  - "@google/genai"
  - protobufjs
