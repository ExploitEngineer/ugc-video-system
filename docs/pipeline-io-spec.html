<!doctype html>
<html lang="en" data-variant="video">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Pipeline · I/O Spec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================== tokens ============================== */
      :root {
        --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --disp: "Space Grotesk", var(--sans);
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

        /* neutral ramp (cool) */
        --bg: oklch(0.985 0.004 240);
        --bg-2: oklch(0.965 0.006 240);
        --grid: oklch(0.93 0.006 240);
        --surface: oklch(1 0 0);
        --surface-2: oklch(0.978 0.005 240);
        --ink: oklch(0.26 0.02 250);
        --ink-2: oklch(0.44 0.018 250);
        --ink-3: oklch(0.56 0.016 250);
        --line: oklch(0.9 0.008 250);
        --line-2: oklch(0.83 0.01 250);

        /* page identity — VIDEO = cyan */
        --brand: oklch(0.6 0.11 218);
        --brand-ink: oklch(0.42 0.1 224);
        --brand-soft: oklch(0.95 0.03 218);

        /* provider hues (light) — [tint bg, text, border] */
        --claude: oklch(0.55 0.13 258); --claude-bg: oklch(0.955 0.03 258); --claude-bd: oklch(0.78 0.08 258);
        --haiku: oklch(0.52 0.13 292); --haiku-bg: oklch(0.955 0.032 292); --haiku-bd: oklch(0.78 0.08 292);
        --gpt: oklch(0.5 0.11 175); --gpt-bg: oklch(0.95 0.035 175); --gpt-bd: oklch(0.75 0.08 175);
        --seed: oklch(0.56 0.12 62); --seed-bg: oklch(0.955 0.04 75); --seed-bd: oklch(0.8 0.09 70);
        --ff: oklch(0.5 0.015 250); --ff-bg: oklch(0.955 0.006 250); --ff-bd: oklch(0.8 0.01 250);
        --nex: oklch(0.52 0.13 322); --nex-bg: oklch(0.955 0.03 322); --nex-bd: oklch(0.79 0.08 322);
        --ce: oklch(0.56 0.14 350); --ce-bg: oklch(0.955 0.032 350); --ce-bd: oklch(0.8 0.08 350);
        --end: oklch(0.55 0.15 22); --end-bg: oklch(0.955 0.035 22); --end-bd: oklch(0.82 0.09 22);
        --gate: oklch(0.5 0.05 250); --gate-bg: oklch(0.96 0.008 250); --gate-bd: oklch(0.78 0.02 250);

        /* block category accents (muted dots) */
        --c-in: oklch(0.6 0.09 250);
        --c-out: oklch(0.55 0.1 155);
        --c-model: var(--brand);
        --c-upload: oklch(0.56 0.1 205);
        --c-cap: oklch(0.6 0.11 70);
        --c-fallback: oklch(0.58 0.13 20);

        --radius: 14px;
        --shadow: 0 1px 2px oklch(0.2 0.03 250 / 0.05), 0 6px 20px oklch(0.2 0.03 250 / 0.05);
        --shadow-pop: 0 10px 34px oklch(0.2 0.03 250 / 0.12);

        --z-sticky: 40; --z-toast: 90;
      }
      html[data-theme="dark"] {
        --bg: oklch(0.19 0.014 255);
        --bg-2: oklch(0.165 0.014 255);
        --grid: oklch(0.26 0.014 255);
        --surface: oklch(0.235 0.016 255);
        --surface-2: oklch(0.215 0.015 255);
        --ink: oklch(0.95 0.008 250);
        --ink-2: oklch(0.78 0.012 250);
        --ink-3: oklch(0.64 0.014 250);
        --line: oklch(0.32 0.014 255);
        --line-2: oklch(0.4 0.016 255);

        --brand: oklch(0.72 0.12 210);
        --brand-ink: oklch(0.82 0.11 208);
        --brand-soft: oklch(0.3 0.06 214);

        --claude: oklch(0.75 0.11 262); --claude-bg: oklch(0.31 0.05 262); --claude-bd: oklch(0.5 0.07 262);
        --haiku: oklch(0.76 0.11 293); --haiku-bg: oklch(0.31 0.05 293); --haiku-bd: oklch(0.5 0.07 293);
        --gpt: oklch(0.74 0.11 175); --gpt-bg: oklch(0.29 0.05 175); --gpt-bd: oklch(0.47 0.07 175);
        --seed: oklch(0.79 0.11 72); --seed-bg: oklch(0.31 0.05 68); --seed-bd: oklch(0.52 0.08 68);
        --ff: oklch(0.72 0.012 250); --ff-bg: oklch(0.3 0.01 250); --ff-bd: oklch(0.46 0.014 250);
        --nex: oklch(0.76 0.11 322); --nex-bg: oklch(0.31 0.05 322); --nex-bd: oklch(0.5 0.07 322);
        --ce: oklch(0.77 0.12 350); --ce-bg: oklch(0.31 0.05 350); --ce-bd: oklch(0.51 0.07 350);
        --end: oklch(0.76 0.13 25); --end-bg: oklch(0.32 0.06 25); --end-bd: oklch(0.53 0.09 25);
        --gate: oklch(0.72 0.03 250); --gate-bg: oklch(0.28 0.012 250); --gate-bd: oklch(0.46 0.02 250);

        --c-in: oklch(0.74 0.08 250);
        --c-out: oklch(0.72 0.11 155);
        --c-upload: oklch(0.74 0.09 205);
        --c-cap: oklch(0.79 0.1 75);
        --c-fallback: oklch(0.76 0.12 25);

        --shadow: 0 1px 2px oklch(0 0 0 / 0.4), 0 8px 24px oklch(0 0 0 / 0.3);
        --shadow-pop: 0 14px 40px oklch(0 0 0 / 0.45);
      }
      html[data-variant="template"] {
        --brand: oklch(0.62 0.12 62);
        --brand-ink: oklch(0.48 0.11 55);
        --brand-soft: oklch(0.95 0.04 70);
      }
      html[data-variant="template"][data-theme="dark"] {
        --brand: oklch(0.79 0.11 68);
        --brand-ink: oklch(0.85 0.1 70);
        --brand-soft: oklch(0.32 0.06 62);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
      body {
        background: var(--bg);
        background-image: radial-gradient(var(--grid) 1px, transparent 1.4px);
        background-size: 30px 30px;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        transition: background-color 0.3s, color 0.3s;
      }
      code {
        font-family: var(--mono);
        font-size: 0.86em;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0.5px 5px;
        color: var(--ink);
        white-space: normal;
        overflow-wrap: anywhere;
      }
      strong { font-weight: 600; color: var(--ink); }
      ::selection { background: var(--brand-soft); }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

      /* ============================== header ============================== */
      header {
        position: sticky; top: 0; z-index: var(--z-sticky);
        background: color-mix(in oklch, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        border-bottom: 1px solid var(--line);
        padding: 13px clamp(16px, 4vw, 40px);
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .brand .mark {
        width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
        background: linear-gradient(145deg, var(--brand), color-mix(in oklch, var(--brand) 55%, var(--ink)));
        display: grid; place-items: center; color: white; box-shadow: var(--shadow);
      }
      .brand .mark svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .brand h1 { font-family: var(--disp); font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
      .brand .meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.02em; margin-top: 1px; }

      .switch { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; }
      .switch a {
        font-family: var(--disp); font-weight: 600; font-size: 12px; letter-spacing: -0.01em;
        text-decoration: none; color: var(--ink-3); padding: 5px 13px; border-radius: 999px; transition: 0.16s;
      }
      .switch a:hover { color: var(--ink); }
      .switch a[aria-current="true"] { background: var(--brand); color: white; box-shadow: var(--shadow); }

      .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
      .search { position: relative; }
      .search input {
        width: clamp(150px, 22vw, 250px); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
        color: var(--ink); font-family: var(--sans); font-size: 13px; padding: 8px 30px 8px 32px; transition: 0.16s;
      }
      .search input::placeholder { color: var(--ink-3); }
      .search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand) 20%, transparent); }
      .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; display: flex; }
      .search .ic svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
      .search .clr { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--ink-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 3px 6px; border-radius: 6px; display: none; }
      .search.has .clr { display: block; }
      .search .clr:hover { color: var(--ink); background: var(--bg-2); }

      .btn {
        display: inline-flex; align-items: center; gap: 7px; font-family: var(--disp); font-weight: 600; font-size: 12.5px;
        padding: 8px 12px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); transition: 0.16s;
      }
      .btn:hover { color: var(--ink); border-color: var(--ink-3); }
      .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .btn.icon { padding: 8px; }

      /* ============================== legend ============================== */
      .legend {
        max-width: 1080px; margin: 22px auto 0; padding: 0 clamp(16px, 4vw, 40px);
        display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
      }
      .legend .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
      .chip {
        font-size: 11.5px; font-weight: 500; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--line-2);
        background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px;
      }
      .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

      /* ============================== rail / main ============================== */
      main { max-width: 1080px; margin: 0 auto; padding: 10px clamp(16px, 4vw, 40px) 40px; position: relative; }
      .rail { position: absolute; left: calc(clamp(16px, 4vw, 40px) + 21px); top: 30px; bottom: 40px; width: 2px; background: linear-gradient(to bottom, transparent, var(--line-2) 6%, var(--line-2) 94%, transparent); z-index: 0; }

      .phase {
        display: flex; align-items: center; gap: 14px; margin: 26px 0 14px; padding-left: 62px; position: relative; z-index: 1;
      }
      .phase span { font-family: var(--disp); font-size: 12px; font-weight: 700; letter-spacing: 0.02em; color: var(--brand-ink); white-space: normal; }
      .phase::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      .phase.hard span { color: var(--ink-2); }

      .node { position: relative; padding-left: 62px; margin-bottom: 12px; z-index: 1; }
      .node > .pin {
        position: absolute; left: 8px; top: 16px; width: 30px; height: 30px; border-radius: 50%;
        background: var(--surface); border: 2px solid var(--brand); color: var(--brand-ink);
        display: grid; place-items: center; font-family: var(--disp); font-weight: 700; font-size: 11px; z-index: 2; box-shadow: var(--shadow);
      }
      .node.k-end > .pin { border-color: var(--end); color: var(--end); }
      .node.k-gate > .pin { border-color: var(--gate); color: var(--gate); border-style: dashed; }
      .node.k-parked > .pin { border-color: var(--line-2); color: var(--ink-3); }
      .node.k-merge > .pin { border-color: var(--ff); color: var(--ff); }

      .par { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 760px) { .par { grid-template-columns: 1fr; } }

      /* ============================== card ============================== */
      .card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow 0.2s, border-color 0.2s; }
      .card:hover { box-shadow: var(--shadow-pop); }
      .card-h { display: flex; align-items: center; gap: 12px; padding: 13px 15px; cursor: pointer; user-select: none; }
      .card-h .tt { flex: 1; min-width: 0; }
      .card-h h2 { font-family: var(--disp); font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .card-h .step-id { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink-3); background: var(--bg-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
      .card-h .sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
      .caret { color: var(--ink-3); transition: transform 0.2s; flex-shrink: 0; }
      .caret svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; display: block; }
      .card.closed .caret { transform: rotate(-90deg); }
      .card.closed .card-b { display: none; }

      .tag {
        font-family: var(--disp); font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; padding: 4px 9px; border-radius: 999px;
        white-space: nowrap; flex-shrink: 0; border: 1px solid; align-self: flex-start; margin-top: 1px;
      }
      .tag[data-p="claude"] { color: var(--claude); background: var(--claude-bg); border-color: var(--claude-bd); }
      .tag[data-p="haiku"] { color: var(--haiku); background: var(--haiku-bg); border-color: var(--haiku-bd); }
      .tag[data-p="gpt"] { color: var(--gpt); background: var(--gpt-bg); border-color: var(--gpt-bd); }
      .tag[data-p="seed"] { color: var(--seed); background: var(--seed-bg); border-color: var(--seed-bd); }
      .tag[data-p="ff"] { color: var(--ff); background: var(--ff-bg); border-color: var(--ff-bd); }
      .tag[data-p="nex"] { color: var(--nex); background: var(--nex-bg); border-color: var(--nex-bd); }
      .tag[data-p="ce"] { color: var(--ce); background: var(--ce-bg); border-color: var(--ce-bd); }
      .tag[data-p="end"] { color: var(--end); background: var(--end-bg); border-color: var(--end-bd); }
      .tag[data-p="gate"] { color: var(--gate); background: var(--gate-bg); border-color: var(--gate-bd); }
      .tag[data-p="parked"] { color: var(--ink-3); background: var(--bg-2); border-color: var(--line-2); }

      .card-b { padding: 4px 15px 15px; border-top: 1px solid var(--line); }
      .banner { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: 10px; padding: 9px 12px; margin: 12px 0 4px; }
      .banner.plan { color: var(--brand-ink); border-color: color-mix(in oklch, var(--brand) 45%, var(--line-2)); background: color-mix(in oklch, var(--brand-soft) 40%, var(--surface)); }

      .blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
      .blk { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
      .blk-h { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
      .blk-h .d { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
      .blk[data-b="in"] .d { background: var(--c-in); }
      .blk[data-b="out"] .d { background: var(--c-out); }
      .blk[data-b="model"] .d { background: var(--c-model); }
      .blk[data-b="upload"] .d { background: var(--c-upload); }
      .blk[data-b="cap"] .d { background: var(--c-cap); }
      .blk[data-b="fallback"] .d { background: var(--c-fallback); }
      .blk.wide { grid-column: 1 / -1; }
      .blk ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .blk li { position: relative; padding-left: 14px; font-size: 12.5px; color: var(--ink-2); }
      .blk li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); }
      .blk[data-b="upload"] li, .blk[data-b="cap"] li, .blk[data-b="fallback"] li { color: var(--ink-2); }

      /* ============================== tables ============================== */
      .sheet { max-width: 1080px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 30px; }
      .sheet-h { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 14px; }
      .sheet-h h3 { font-family: var(--disp); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
      .sheet-h .k { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
      .twrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); background: var(--surface); }
      table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 560px; }
      thead th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); position: sticky; top: 0; }
      tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover td { background: var(--surface-2); }
      td.mono, td .path { font-family: var(--mono); font-size: 11.5px; color: var(--ink); white-space: nowrap; }
      td strong { color: var(--ink); }

      /* ============================== search states ============================== */
      body.searching .node.nohit, body.searching .phase { display: none; }
      body.searching .par.nohit { display: none; }
      .count { max-width: 1080px; margin: 12px auto -4px; padding: 0 clamp(16px, 4vw, 40px); font-size: 12px; color: var(--ink-3); font-family: var(--mono); display: none; }
      body.searching .count { display: block; }

      footer { max-width: 1080px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px) 60px; color: var(--ink-3); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); }
      footer b { color: var(--ink-2); font-weight: 600; }

      .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 13px; font-family: var(--disp); font-weight: 600; opacity: 0; transition: 0.28s cubic-bezier(0.22,1,0.36,1); z-index: var(--z-toast); pointer-events: none; box-shadow: var(--shadow-pop); }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      @media print {
        header, .tools, .toast, .count, .switch { display: none !important; }
        body { background: #fff; color: #000; background-image: none; }
        .card, .twrap { box-shadow: none; break-inside: avoid; }
        .card-b { display: block !important; }
        .rail { display: none; }
        .node { padding-left: 0; }
        .node > .pin { position: static; display: inline-grid; margin-bottom: 6px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark" id="mark"></div>
        <div>
          <h1 id="ptitle">Video Pipeline</h1>
          <div class="meta" id="pmeta">I/O SPEC</div>
        </div>
      </div>
      <nav class="switch" aria-label="Pipeline">
        <a href="./pipeline-io-spec.html" aria-current="true">Video</a>
        <a href="./template-pipeline-io-spec.html">Template</a>
      </nav>
      <div class="tools">
        <div class="search" id="searchWrap">
          <span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.4-3.4" /></svg></span>
          <input id="q" type="search" placeholder="Filter steps & fields…" aria-label="Filter" />
          <button class="clr" id="qclr" aria-label="Clear" title="Clear">×</button>
        </div>
        <button class="btn icon" id="fold" title="Collapse / expand all" aria-label="Collapse or expand all"></button>
        <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="btn" id="print"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6" /><rect x="3" y="9" width="18" height="8" rx="2" /><path d="M6 14h12v7H6z" /></svg>PDF</button>
      </div>
    </header>

    <div class="legend" id="legend"></div>
    <div class="count" id="count"></div>
    <main id="app"><div class="rail"></div></main>
    <div class="sheet" id="sheets"></div>

    <footer id="foot"></footer>
    <div class="toast" id="toast" role="status"></div>

    <script>
      "use strict";

      /* ============================== data ============================== */
      const DATA = {
        variant: "video",
        title: "Video Pipeline",
        meta: "I/O SPEC · runs.pipeline = \"video\" · verified 2026-07-15",
        legend: [
          ["claude", "Claude Sonnet 4.6 · OpenRouter — reason / vision"],
          ["gpt", "gpt-image-2 — images"],
          ["seed", "Seedance 2.0 · BytePlus — video"],
          ["ff", "ffmpeg — merge / extract (no AI)"],
          ["ce", "CE.SDK — post-completion editor"],
          ["gate", "gate — confirm mode only"],
          ["parked", "parked / off by default"],
          ["end", "endpoint"],
        ],
        stages: [
          { kind: "end", id: "IN", p: "end", plabel: "POST /runs", title: "Create run",
            sub: "multipart request → inserts a queued run + persists uploads",
            blocks: {
              in: ["`productImage` optional (required only for product-required ad types) · `personImage` optional — PNG / JPEG / WebP", "`prompt` 1–2000 · `mode` automatic | confirm · `aspectRatio` 16:9 | 9:16", "`adType` auto (detect) | one of 16 locked types · `duration` 15s | 30s | 45s | 60s · `brandText` optional"],
              out: ["inserts project + `runs` row — status **queued**, `pipeline=video` · `criticEnabled` default **false**", "persists `product_upload` / `person_upload` assets → **201 RunDetail**"],
              upload: ["`product_upload` / `person_upload` → `runs/{runId}/{kind}-{uuid}` (person normalized to jpg)"],
              cap: ["body ≤ **12 MB** total · per image ≤ **10 MB** · prompt ≤ 2000 · brandText ≤ 4000"],
            } },

          { kind: "step", id: "0", p: "claude", title: "interpretAdStyle + detect ad type",
            sub: "first tick of a queued run · only for pipeline=video (template skips this)",
            blocks: {
              in: ["`prompt` · upload presence · product / person briefs · unresolved bracket placeholders"],
              out: ["→ `runs`: `adStyle`, `adType` (∈ 16 — auto clamp + confidence-gate + reconcile, or user-locked), `adTypeSource`, `hooks {visualLead, overlay}`, `adTypeConfidence`, `detectorMeta` → status **running**"],
              model: ["Claude via OpenRouter · `backend:\"claude\"` · maxTokens 1500 · 2 attempts"],
              fallback: ["both attempts fail → asset-implied **default plan** (never blocks the run)"],
            } },

          { phase: "Reference phase — one parallel unit · Promise.allSettled" },

          { kind: "par", id: "R", cards: [
            { p: "gpt", title: "product_sheet", sub: "productSheetBuilder · skipped when no product uploaded",
              blocks: {
                in: ["`product_upload` (**required** — throws if absent) · `prompt` · `adStyle` · `aspectRatio`"],
                out: ["asset `product_sheet` + `product_reference_sheets` row — 2×2 views (front / ¾ / side / rear), `promptUsed`, status draft"],
                model: ["Claude plan (retry once, 4096→6144) → **gpt-image-2** `images.edit` · 4K · quality high · `neutralizeCast`"],
                upload: ["`runs/{runId}/product_sheet-{uuid}.webp` (+ provider-only **jpg** copy for Seedance)"],
                fallback: ["plan-parse retry once · `neutralizeCast` passthrough on failure"],
              } },
            { p: "gpt", title: "person_sheet", sub: "generatePerson · product image NEVER reaches this skill",
              blocks: {
                in: ["`personBrief` · optional base image — `person_upload` (first gen) or prior sheet (revise)", "no product-sheet dependency — runs fully in parallel"],
                out: ["asset `person_sheet` + `person_reference_sheets` row — **8 panels**: 4 full-body angles + 4 matching face close-ups"],
                model: ["base image → gpt-image-2 `images.edit` (no plan LLM) · none → Claude invent → gpt-image-2 t2i · 4K quality high"],
                upload: ["`runs/{runId}/person_sheet-{uuid}.webp` (+ provider **jpg** copy)"],
                fallback: ["**SKIPPED** when the ad type needs no person & none uploaded — signaled up front via `skippedSteps`"],
              } },
          ] },

          { kind: "step", id: "R+", p: "claude", title: "describeProduct ∥ person-brief — best-effort, non-fatal",
            sub: "run inside the reference phase, off the sheets' critical path (not step enum values)",
            blocks: {
              in: ["describeProduct: `product_upload` (vision) + `prompt` · derivePersonBrief: `person_upload` (vision) or product-only invent"],
              out: ["→ `runs.productBrief`, `runs.productUse` · `runs.personBrief` (+ `supportingCast`)"],
              model: ["Claude · `backend:\"claude\"` · jsonMode"],
              fallback: ["both wrapped in try/catch — empty brief → image-only grounding, run continues"],
            } },

          { kind: "gate", id: "G1", p: "gate", title: "Reference gate", sub: "confirm mode only — automatic never pauses",
            blocks: {
              in: ["status **awaiting_confirmation** → `POST /runs/:id/feedback` → running | regenerating"],
              out: ["blank feedback = continue · text = approve | revise (classified) — regenerates the **person sheet only**; loops until approve"],
            } },

          { kind: "parked", id: "·", p: "parked", title: "product_inspection — Critic (PARKED)",
            sub: "code retained but dormant · runs.criticEnabled defaults false",
            blocks: {
              in: ["latest product sheet + `product_upload` ground truth · `views` · `prompt`"],
              out: ["verdict; on issue regenerates the product sheet once (localized or full rebuild)"],
              model: ["Claude vision · jsonMode — **skipped** unless `criticEnabled` is explicitly on"],
            } },

          { phase: "Branch by duration — 15s = single clip · 30/45/60s = N master-crops + merge", hard: true },
          { phase: "15s · single clip (default path)" },

          { kind: "step", id: "5a", p: "gpt", title: "storyboard", sub: "per-type LOOK + neutralized cast · 15s only",
            blocks: {
              in: ["product sheet ref? · person sheet ref? · `prompt` · briefs · `hooks` · `adType` · `aspectRatio` · directive?"],
              out: ["asset `storyboard_sheet` (segmentIndex null) + row — labelled **2×2** keyframe, badges 01–04 + caption bar", "`scenes[4] {index, cameraAngle, actionMovement, sceneDescription, panelCaption, transcript, adStyle}`", "`graphic_text` look → CLEAN finished frames (no badges / bars)"],
              model: ["Claude plan (retry once, 5120→8192) → gpt-image-2 · 4K quality high · `neutralizeCast`", "one of 4 LOOKs: ugc_authentic · cinematic_polished · graphic_text · demo_clean"],
              upload: ["`runs/{runId}/storyboard_sheet-{uuid}.webp` (+ provider jpg + **badge-cropped clean** copy for the video step)"],
              fallback: ["plan-parse retry once with a larger token ceiling"],
            } },

          { kind: "gate", id: "G2", p: "gate", title: "Storyboard gate", sub: "confirm mode only — shared by both paths",
            blocks: { out: ["15s: approve | revise · multi: `parseTargetSegments` \"fix storyboard 3\" → regen that segment only; newest-per-index wins"] } },

          { kind: "step", id: "6a", p: "seed", title: "video", sub: "look-aware · 15s only", tail: "→ DONE",
            blocks: {
              in: ["**@Image1** product sheet — plain reference (identity lock)", "**storyboard sheet** — LOOK ref, badge-cropped via `cleanStoryboardRefUrl`; rides the `asset://` path for live-action looks", "**person face** — `asset://<id>` (V4-signed) when hasPerson", "`scenes` (sceneDescription + transcript) · `prompt` · `characterAnchor = personBrief`"],
              out: ["asset `final_video` (segmentIndex null) + `videos` row — durationSec, hasAudio, `providerMeta {provider: byteplus, model, taskId, videoPrompt}`, status completed", "MP4 ~15s with native synchronized audio"],
              model: ["Claude `buildVideoPrompt` (2 attempts → deterministic) — one timestamped shot-list; tail = role legend + per-LOOK negatives + `--camerafixed true` (omitted for graphic_text)", "→ Seedance 2.0 submit → poll → download · generate_audio true · watermark false"],
              upload: ["`runs/{runId}/final_video-{uuid}.mp4`"],
              cap: ["poll **30 min / 5s** · download 120s ×3 · duration snapped to [4,5,6,8,10,12,15] · retry ladder ≤ 3 · 1080p (env)"],
              fallback: ["prompt LLM → deterministic · retry ladder · audio-safe re-roll (`PROVIDER_AUDIO_BLOCKED`) · soft-fail → **awaiting_regen** · pollVideoTolerant"],
            } },

          { phase: "30 · 45 · 60s · N segments → merge (N = 2 / 3 / 4)" },

          { kind: "step", id: "5b", p: "gpt", title: "segment_storyboard · generateMaster", sub: "ONE 4×N master sheet → crop into N row-strips",
            blocks: {
              in: ["product sheet ref? · person sheet ref? · `prompt` · `segmentCount` N · directive?", "authored as ONE coherent 4×N master from the prompt — no separate narrative_outline / visual_style step"],
              out: ["asset `storyboard_master` + row (segmentIndex null)", "`cropRowsAs2x2` → N per-segment `storyboard_sheet` assets (segmentIndex 0..N-1), each carrying its 4 scenes", "each row's 4 panels RE-TILED into a 2×2 block — BytePlus CreateAsset rejects aspect outside 0.4–2.5"],
              model: ["Claude plan (ceilings 12288→16384) → gpt-image-2 4K · anti-repetition kills duplicate panels · `neutralizeCast`"],
              upload: ["`runs/{runId}/storyboard_master-{uuid}.webp` + N× `storyboard_sheet-{uuid}.webp`"],
            } },

          { kind: "step", id: "6b", p: "seed", title: "segment_video ×N", sub: "parallel · cap SEGMENT_VIDEO_CONCURRENCY = 4 · idempotent",
            blocks: {
              in: ["per segment i: this segment's crop (LOOK, `asset://`) · SHARED product sheet · SHARED person face `asset://` when hasPerson", "`scenes` · `prompt` · `segmentIndex` · `segmentCount`"],
              out: ["`videos` (segmentIndex = i) + `segment_video` assets — N × MP4 ~15s native audio"],
              model: ["Claude `buildVideoPrompt` adds continuity (\"part i of N… keep SAME person / wardrobe / product / lighting\") + otherSummaries; same per-LOOK negatives + `--camerafixed`"],
              upload: ["`runs/{runId}/segment_video-{uuid}.mp4`"],
              cap: ["concurrency **4** · same poll / retry ladder as 15s"],
            } },

          { kind: "merge", id: "7", p: "ff", title: "mergeSegments", sub: "ffmpeg 3-pass · NO AI",
            blocks: {
              in: ["the N `segment_video` clips loaded in segment_index order · `MUSIC_BED_URL`?"],
              out: ["asset `final_video` (segmentIndex null) + `videos` row — `providerMeta {provider: ffmpeg, merged: true, segmentCount}`, durationSec = N×15"],
              model: ["**A** per-segment normalize (scale / pad · fps · eq grade · loudnorm I=-16:TP=-1.5:LRA=11 · libx264 CRF20)", "**B** concat demuxer · stream-copy `-c copy`", "**C** optional music bed — sidechain-ducked under native audio"],
              upload: ["`runs/{runId}/final_video-{uuid}.mp4`"],
              cap: ["concurrency **1** process-wide · threads 2 · timeout 4 min · 24 fps · retry once on signal / OOM kill"],
              fallback: ["music-mix best-effort — bad / missing bed → music-free merge"],
            } },

          { kind: "end", id: "OUT", p: "end", plabel: "GET /runs/:id/artifacts", title: "Output",
            sub: "both paths converge here · run status = completed",
            blocks: { out: ["productSheet · personSheet · storyboardSheet (15s) · storyboardMaster (multi)", "finalVideo · `video {durationSec, hasAudio}` · segmentStoryboards[] · segmentVideos[] (multi)"] } },

          { phase: "Post-completion — editor · NOT a pipeline step (worker never touches a completed run)" },

          { kind: "step", id: "ED", p: "ce", title: "Video editor · /studio/[runId]/edit", sub: "img.ly CE.SDK · client-side WASM · non-destructive",
            blocks: {
              in: ["`final_video` (+ latest `editor_scene` when resuming a prior edit)"],
              out: ["`GET /runs/:id/audio-track` → ffmpeg extract → `final_audio` (AAC m4a) · lazy + idempotent", "`POST /runs/:id/edited-video` → `edited_video` (mp4 ≤ 200 MB) + `editor_scene` (json) — original final_video kept"],
              model: ["AI captions: each scene transcript → timed WebVTT cues (≤ 42 chars) — **no external AI call**"],
              upload: ["`runs/{runId}/edited_video-{uuid}.mp4` · `editor_scene-{uuid}.json` · `final_audio-{uuid}.m4a`"],
              cap: ["edited-video body ≤ **210 MB** · per file ≤ 200 MB, MP4 only · needs status completed"],
            } },

          { kind: "end", id: "API", p: "end", plabel: "Run control", title: "Lifecycle · API + SSE",
            sub: "studio subscribes via EventSource",
            blocks: {
              in: ["`GET /runs` list · `GET /runs/:id` snapshot · `GET /runs/events` SSE run-list · `GET /runs/:id/events` SSE per-run (closes `done` on terminal + final_video)"],
              out: ["`POST /runs/:id/feedback` gate · `POST /runs/:id/cancel` → failed RUN_CANCELLED · `DELETE /runs/:id` purge run + owned assets"],
            } },
        ],

        tables: {
          storage: {
            note: "Single PUBLIC bucket `ugc-assets` · run assets path `runs/{runId}/{kind}-{uuid}.{ext}` · Seedance-bound refs get an EXTRA provider-only jpg copy (BytePlus rejects WebP).",
            head: ["Asset kind", "Path", "Written by"],
            rows: [
              ["product_upload / person_upload", "runs/{runId}/{kind}-{uuid}", "POST /runs"],
              ["product_sheet", "runs/{runId}/product_sheet-{uuid}.webp", "image/product-sheet"],
              ["person_sheet", "runs/{runId}/person_sheet-{uuid}.webp", "image/person-image"],
              ["storyboard_sheet (15s + crops)", "runs/{runId}/storyboard_sheet-{uuid}.webp", "image/storyboard + orchestrator"],
              ["storyboard_master (multi)", "runs/{runId}/storyboard_master-{uuid}.webp", "orchestrator"],
              ["final_video (15s + merged)", "runs/{runId}/final_video-{uuid}.mp4", "video / merge"],
              ["segment_video", "runs/{runId}/segment_video-{uuid}.mp4", "video (segment)"],
              ["edited_video / editor_scene", "runs/{runId}/edited_video-{uuid}.mp4 · editor_scene-{uuid}.json", "POST /edited-video"],
              ["final_audio", "runs/{runId}/final_audio-{uuid}.m4a", "GET /audio-track"],
              ["provider-safe jpg copies", "runs/{runId}/{kind}-{uuid}.jpg", "lib/provider-refs"],
            ],
          },
          caps: {
            head: ["Limit", "Value", "Source"],
            rows: [
              ["POST /runs body", "12 MB total", "routes/runs.ts MAX_CREATE_BODY_BYTES"],
              ["Per uploaded image", "10 MB · PNG / JPEG / WebP", "routes/runs.ts MAX_IMAGE_BYTES"],
              ["Prompt / brandText", "≤ 2000 / ≤ 4000 chars", "shared/dto.ts"],
              ["edited-video body / file", "210 MB / 200 MB MP4", "routes/runs.ts"],
              ["Image gen size", "4K UHD 3840×2160 · quality high · WebP q100", "openai/constants.ts IMAGE_SIZE_BY_RATIO"],
              ["Image shrink ladder / attempts", "4K → 2560×1440 → 2048×1152 · 5 attempts", "openai/constants + index"],
              ["SEGMENT_VIDEO_CONCURRENCY", "4 (env-tunable)", "config/index.ts"],
              ["Seedance poll", "30 min timeout · 5s interval", "config BYTEPLUS_POLL_*"],
              ["Seedance durations", "[4, 5, 6, 8, 10, 12, 15] s · snapped UP", "providers/video.ts"],
              ["Video resolution", "1080p (env 480 / 720 / 1080)", "config/index.ts"],
              ["Video retry ladder", "≤ 3 submits · download 120s ×3", "video/retry.ts · video/index.ts"],
              ["Merge", "concurrency 1 · threads 2 · 4 min · 24 fps · retry once on kill", "lib/video/merge.ts"],
              ["Storage upload", "3 attempts · 800ms backoff · 120s / attempt", "lib/storage.ts"],
            ],
          },
          fallbacks: {
            head: ["Fallback", "Behavior", "Source"],
            rows: [
              ["OpenRouter → gpt-4.1", "any claude / small call degrades to gpt-4.1 when OPENROUTER_API_KEY unset", "openai/index.ts resolveBackend"],
              ["describeProduct / derivePersonBrief", "best-effort try/catch — empty brief → image-only grounding, run continues", "orchestrator.ts"],
              ["person skip", "no character + no upload → no person sheet, straight to storyboard", "orchestrator / plan.ts"],
              ["neutralizeCast", "returns input bytes unchanged on any failure / negligible correction", "lib/image/color.ts"],
              ["providerSafeRefUrl / cleanStoryboardRefUrl", "fetch / crop hiccup → raw URL; never fails the run", "lib/provider-refs.ts"],
              ["plan-parse", "retry once with a larger token ceiling before throwing", "product-sheet · storyboard"],
              ["video prompt", "2 LLM attempts → deterministic camerafixed prompt", "video/index.ts"],
              ["video retry", "≤ 3 submits + audio-safe re-roll (PROVIDER_AUDIO_BLOCKED)", "video/retry.ts"],
              ["soft-fail → awaiting_regen", "recoverable video failures park (not failed); user regenerates", "orchestrator · retry.ts"],
              ["pollVideoTolerant", "transient DNS / socket blip → synthetic \"processing\", re-polls same task", "providers/video.ts"],
              ["music mix", "bad / incompatible bed → music-free merge", "lib/video/merge.ts"],
            ],
          },
        },
        foot: "Read-only spec · click a step to collapse · press <b>/</b> to filter · <b>PDF</b> prints all sections expanded. Duration is chosen per run (15s single clip · 30/45/60s merge). The <code>runs</code> row is the DB-authoritative, idempotent-on-resume state machine; gates exist only in <b>confirm</b> mode; the Critic is parked. Verified against source on 2026-07-15.",
      };

      /* ============================== render ============================== */
      const app = document.getElementById("app");
      const CARET = '<span class="caret"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>';
      const BLK_ORDER = ["in", "out", "model", "upload", "cap", "fallback"];
      const BLK_LABEL = { in: "In", out: "Out", model: "Model", upload: "Upload", cap: "Cap", fallback: "Fallback" };
      const closed = new Set();

      const fmt = (s) => s
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

      function blocksHTML(b) {
        if (!b) return "";
        let out = "";
        for (const key of BLK_ORDER) {
          const rows = b[key];
          if (!rows || !rows.length) continue;
          const wide = key === "model" || rows.some((r) => r.length > 90) ? " wide" : "";
          out += `<div class="blk${wide}" data-b="${key}"><div class="blk-h"><span class="d"></span>${BLK_LABEL[key]}</div><ul>${rows.map((r) => `<li>${fmt(r)}</li>`).join("")}</ul></div>`;
        }
        return `<div class="blocks">${out}</div>`;
      }

      function cardHTML(c, idx) {
        const idPill = c.id ? `<span class="step-id">${c.id}</span>` : "";
        const head = `<div class="card-h"><div class="tt"><h2>${idPill}${fmt(c.title)}${c.tail ? ` <span class="step-id">${fmt(c.tail)}</span>` : ""}</h2>${c.sub ? `<div class="sub">${fmt(c.sub)}</div>` : ""}</div>${c.p ? `<span class="tag" data-p="${c.p}">${c.pTag || DATA.legend.find((l) => l[0] === c.p)?.[1].split(" — ")[0].split(" · ")[0] || ""}</span>` : ""}${CARET}</div>`;
        const banner = c.plabel ? `<div class="banner${c.p === "end" ? "" : " plan"}"><code>${c.plabel}</code></div>` : "";
        const isClosed = closed.has(idx) ? " closed" : "";
        return `<article class="card${isClosed}" data-idx="${idx}">${head}<div class="card-b">${banner}${blocksHTML(c.blocks)}</div></article>`;
      }

      function render() {
        let html = '<div class="rail"></div>';
        DATA.stages.forEach((st, i) => {
          if (st.phase) { html += `<div class="phase${st.hard ? " hard" : ""}"><span>${fmt(st.phase)}</span></div>`; return; }
          if (st.kind === "par") {
            html += `<div class="node" data-idx="${i}"><span class="pin">${st.id || ""}</span><div class="par">${st.cards.map((c, j) => cardHTML(c, `${i}.${j}`)).join("")}</div></div>`;
            return;
          }
          html += `<div class="node k-${st.kind === "step" ? "step" : st.kind}" data-idx="${i}"><span class="pin">${st.id || ""}</span>${cardHTML(st, `${i}`)}</div>`;
        });
        app.innerHTML = html;
        // provider tag labels: short names
        document.querySelectorAll(".tag").forEach((t) => {
          const map = { claude: "Claude 4.6", haiku: "Haiku 4.5", gpt: "gpt-image-2", seed: "Seedance 2.0", ff: "ffmpeg", nex: "Nexrender", ce: "CE.SDK", end: "endpoint", gate: "gate", parked: "parked" };
          if (!t.textContent.trim()) t.textContent = map[t.dataset.p] || "";
          else t.textContent = map[t.dataset.p] || t.textContent;
        });
      }

      function tableHTML(t) {
        return `<div class="twrap"><table><thead><tr>${t.head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i === 1 && (t === DATA.tables.storage) ? "mono" : ""}">${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      function renderSheets() {
        const T = DATA.tables;
        document.getElementById("sheets").innerHTML =
          `<div class="sheet-h"><h3>Upload &amp; storage</h3><span class="k">where every file lands</span></div>${T.storage.note ? `<div class="banner" style="margin:0 0 12px">${fmt(T.storage.note)}</div>` : ""}${tableHTML(T.storage)}` +
          `<div class="sheet-h"><h3>Caps &amp; limits</h3><span class="k">the ceilings</span></div>${tableHTML(T.caps)}` +
          `<div class="sheet-h"><h3>Fallbacks</h3><span class="k">how it degrades, not dies</span></div>${tableHTML(T.fallbacks)}`;
      }

      function renderLegend() {
        const map = { claude: "--claude", haiku: "--haiku", gpt: "--gpt", seed: "--seed", ff: "--ff", nex: "--nex", ce: "--ce", end: "--end", gate: "--gate", parked: "--ink-3" };
        document.getElementById("legend").innerHTML = `<span class="lbl">Legend</span>` +
          DATA.legend.map(([k, label]) => `<span class="chip"><span class="dot" style="background:var(${map[k]})"></span>${label}</span>`).join("");
      }

      /* ============================== chrome ============================== */
      document.getElementById("ptitle").textContent = DATA.title;
      document.getElementById("pmeta").textContent = DATA.meta;
      document.getElementById("foot").innerHTML = DATA.foot;
      document.getElementById("mark").innerHTML = DATA.variant === "template"
        ? '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="m10 8 6 4-6 4V8z"/><rect x="2" y="4" width="20" height="16" rx="3"/></svg>';

      renderLegend();
      render();
      renderSheets();

      // theme
      const themeBtn = document.getElementById("theme");
      const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      function setTheme(t) {
        document.documentElement.dataset.theme = t;
        themeBtn.innerHTML = t === "dark" ? SUN : MOON;
      }
      const urlTheme = new URLSearchParams(location.search).get("theme");
      setTheme(urlTheme === "dark" || urlTheme === "light" ? urlTheme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

      // fold
      const foldBtn = document.getElementById("fold");
      const FOLD = '<svg viewBox="0 0 24 24"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg>';
      const UNFOLD = '<svg viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>';
      let allClosed = false;
      foldBtn.innerHTML = FOLD;
      foldBtn.onclick = () => {
        allClosed = !allClosed;
        document.querySelectorAll(".card").forEach((c) => {
          c.classList.toggle("closed", allClosed);
          allClosed ? closed.add(c.dataset.idx) : closed.delete(c.dataset.idx);
        });
        foldBtn.innerHTML = allClosed ? UNFOLD : FOLD;
      };

      // collapse per card
      app.addEventListener("click", (e) => {
        const h = e.target.closest(".card-h");
        if (!h) return;
        const card = h.closest(".card");
        card.classList.toggle("closed");
        const idx = card.dataset.idx;
        card.classList.contains("closed") ? closed.add(idx) : closed.delete(idx);
      });

      // search
      const q = document.getElementById("q");
      const qWrap = document.getElementById("searchWrap");
      const countEl = document.getElementById("count");
      function applySearch() {
        const term = q.value.trim().toLowerCase();
        qWrap.classList.toggle("has", term.length > 0);
        if (!term) { document.body.classList.remove("searching"); return; }
        document.body.classList.add("searching");
        let hits = 0;
        document.querySelectorAll(".node").forEach((node) => {
          let nodeHit = false;
          node.querySelectorAll(".card").forEach((card) => {
            const match = card.textContent.toLowerCase().includes(term);
            if (match) { nodeHit = true; hits++; card.classList.remove("closed"); }
          });
          node.classList.toggle("nohit", !nodeHit);
          node.querySelectorAll(".par").forEach((p) => p.classList.toggle("nohit", !nodeHit));
        });
        countEl.textContent = hits ? `${hits} step${hits === 1 ? "" : "s"} match "${q.value.trim()}"` : `no steps match "${q.value.trim()}"`;
      }
      q.addEventListener("input", applySearch);
      document.getElementById("qclr").onclick = () => { q.value = ""; applySearch(); q.focus(); };
      addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
        if (e.key === "Escape" && document.activeElement === q) { q.value = ""; applySearch(); q.blur(); }
      });

      // print / toast
      const toast = document.getElementById("toast");
      let tt;
      document.getElementById("print").onclick = () => {
        toast.textContent = "Opening print dialog…"; toast.classList.add("show");
        clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 1600);
        setTimeout(() => print(), 120);
      };
    </script>
  </body>
</html>
