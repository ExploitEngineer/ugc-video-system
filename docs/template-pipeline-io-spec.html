<!doctype html>
<html lang="en" data-variant="template">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Pipeline · I/O Spec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================== tokens ============================== */
      :root {
        --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --disp: "Space Grotesk", var(--sans);
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

        --bg: oklch(0.985 0.004 240);
        --bg-2: oklch(0.965 0.006 240);
        --grid: oklch(0.93 0.006 240);
        --surface: oklch(1 0 0);
        --surface-2: oklch(0.978 0.005 240);
        --ink: oklch(0.26 0.02 250);
        --ink-2: oklch(0.44 0.018 250);
        --ink-3: oklch(0.56 0.016 250);
        --line: oklch(0.9 0.008 250);
        --line-2: oklch(0.83 0.01 250);

        /* page identity — TEMPLATE = amber / gold */
        --brand: oklch(0.62 0.12 62);
        --brand-ink: oklch(0.48 0.11 55);
        --brand-soft: oklch(0.95 0.04 70);

        --claude: oklch(0.55 0.13 258); --claude-bg: oklch(0.955 0.03 258); --claude-bd: oklch(0.78 0.08 258);
        --haiku: oklch(0.52 0.13 292); --haiku-bg: oklch(0.955 0.032 292); --haiku-bd: oklch(0.78 0.08 292);
        --gpt: oklch(0.5 0.11 175); --gpt-bg: oklch(0.95 0.035 175); --gpt-bd: oklch(0.75 0.08 175);
        --seed: oklch(0.56 0.12 62); --seed-bg: oklch(0.955 0.04 75); --seed-bd: oklch(0.8 0.09 70);
        --gemini: oklch(0.54 0.13 232); --gemini-bg: oklch(0.955 0.03 232); --gemini-bd: oklch(0.78 0.08 232);
        --ff: oklch(0.5 0.015 250); --ff-bg: oklch(0.955 0.006 250); --ff-bd: oklch(0.8 0.01 250);
        --nex: oklch(0.52 0.13 322); --nex-bg: oklch(0.955 0.03 322); --nex-bd: oklch(0.79 0.08 322);
        --ce: oklch(0.56 0.14 350); --ce-bg: oklch(0.955 0.032 350); --ce-bd: oklch(0.8 0.08 350);
        --end: oklch(0.55 0.15 22); --end-bg: oklch(0.955 0.035 22); --end-bd: oklch(0.82 0.09 22);
        --gate: oklch(0.5 0.05 250); --gate-bg: oklch(0.96 0.008 250); --gate-bd: oklch(0.78 0.02 250);

        --c-in: oklch(0.6 0.09 250);
        --c-out: oklch(0.55 0.1 155);
        --c-model: var(--brand);
        --c-upload: oklch(0.56 0.1 205);
        --c-cap: oklch(0.6 0.11 70);
        --c-fallback: oklch(0.58 0.13 20);

        --radius: 14px;
        --shadow: 0 1px 2px oklch(0.2 0.03 250 / 0.05), 0 6px 20px oklch(0.2 0.03 250 / 0.05);
        --shadow-pop: 0 10px 34px oklch(0.2 0.03 250 / 0.12);
        --z-sticky: 40; --z-toast: 90;
      }
      html[data-theme="dark"] {
        --bg: oklch(0.19 0.014 255);
        --bg-2: oklch(0.165 0.014 255);
        --grid: oklch(0.26 0.014 255);
        --surface: oklch(0.235 0.016 255);
        --surface-2: oklch(0.215 0.015 255);
        --ink: oklch(0.95 0.008 250);
        --ink-2: oklch(0.78 0.012 250);
        --ink-3: oklch(0.64 0.014 250);
        --line: oklch(0.32 0.014 255);
        --line-2: oklch(0.4 0.016 255);

        --brand: oklch(0.79 0.11 68);
        --brand-ink: oklch(0.85 0.1 70);
        --brand-soft: oklch(0.32 0.06 62);

        --claude: oklch(0.75 0.11 262); --claude-bg: oklch(0.31 0.05 262); --claude-bd: oklch(0.5 0.07 262);
        --haiku: oklch(0.76 0.11 293); --haiku-bg: oklch(0.31 0.05 293); --haiku-bd: oklch(0.5 0.07 293);
        --gpt: oklch(0.74 0.11 175); --gpt-bg: oklch(0.29 0.05 175); --gpt-bd: oklch(0.47 0.07 175);
        --seed: oklch(0.79 0.11 72); --seed-bg: oklch(0.31 0.05 68); --seed-bd: oklch(0.52 0.08 68);
        --gemini: oklch(0.76 0.11 234); --gemini-bg: oklch(0.31 0.05 234); --gemini-bd: oklch(0.5 0.07 234);
        --ff: oklch(0.72 0.012 250); --ff-bg: oklch(0.3 0.01 250); --ff-bd: oklch(0.46 0.014 250);
        --nex: oklch(0.76 0.11 322); --nex-bg: oklch(0.31 0.05 322); --nex-bd: oklch(0.5 0.07 322);
        --ce: oklch(0.77 0.12 350); --ce-bg: oklch(0.31 0.05 350); --ce-bd: oklch(0.51 0.07 350);
        --end: oklch(0.76 0.13 25); --end-bg: oklch(0.32 0.06 25); --end-bd: oklch(0.53 0.09 25);
        --gate: oklch(0.72 0.03 250); --gate-bg: oklch(0.28 0.012 250); --gate-bd: oklch(0.46 0.02 250);

        --c-in: oklch(0.74 0.08 250);
        --c-out: oklch(0.72 0.11 155);
        --c-upload: oklch(0.74 0.09 205);
        --c-cap: oklch(0.79 0.1 75);
        --c-fallback: oklch(0.76 0.12 25);

        --shadow: 0 1px 2px oklch(0 0 0 / 0.4), 0 8px 24px oklch(0 0 0 / 0.3);
        --shadow-pop: 0 14px 40px oklch(0 0 0 / 0.45);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
      body {
        background: var(--bg);
        background-image: radial-gradient(var(--grid) 1px, transparent 1.4px);
        background-size: 30px 30px;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        transition: background-color 0.3s, color 0.3s;
      }
      code {
        font-family: var(--mono);
        font-size: 0.86em;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0.5px 5px;
        color: var(--ink);
        white-space: normal;
        overflow-wrap: anywhere;
      }
      strong { font-weight: 600; color: var(--ink); }
      ::selection { background: var(--brand-soft); }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

      header {
        position: sticky; top: 0; z-index: var(--z-sticky);
        background: color-mix(in oklch, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        border-bottom: 1px solid var(--line);
        padding: 13px clamp(16px, 4vw, 40px);
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .brand .mark {
        width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
        background: linear-gradient(145deg, var(--brand), color-mix(in oklch, var(--brand) 55%, var(--ink)));
        display: grid; place-items: center; color: white; box-shadow: var(--shadow);
      }
      .brand .mark svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .brand h1 { font-family: var(--disp); font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
      .brand .meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.02em; margin-top: 1px; }

      .switch { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; }
      .switch a {
        font-family: var(--disp); font-weight: 600; font-size: 12px; letter-spacing: -0.01em;
        text-decoration: none; color: var(--ink-3); padding: 5px 13px; border-radius: 999px; transition: 0.16s;
      }
      .switch a:hover { color: var(--ink); }
      .switch a[aria-current="true"] { background: var(--brand); color: oklch(0.2 0.02 60); box-shadow: var(--shadow); }
      html[data-theme="dark"] .switch a[aria-current="true"] { color: oklch(0.18 0.02 60); }

      .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
      .search { position: relative; }
      .search input {
        width: clamp(150px, 22vw, 250px); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
        color: var(--ink); font-family: var(--sans); font-size: 13px; padding: 8px 30px 8px 32px; transition: 0.16s;
      }
      .search input::placeholder { color: var(--ink-3); }
      .search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand) 20%, transparent); }
      .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; display: flex; }
      .search .ic svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
      .search .clr { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none; color: var(--ink-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 3px 6px; border-radius: 6px; display: none; }
      .search.has .clr { display: block; }
      .search .clr:hover { color: var(--ink); background: var(--bg-2); }

      .btn {
        display: inline-flex; align-items: center; gap: 7px; font-family: var(--disp); font-weight: 600; font-size: 12.5px;
        padding: 8px 12px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); transition: 0.16s;
      }
      .btn:hover { color: var(--ink); border-color: var(--ink-3); }
      .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .btn.icon { padding: 8px; }

      .legend {
        max-width: 1080px; margin: 22px auto 0; padding: 0 clamp(16px, 4vw, 40px);
        display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
      }
      .legend .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
      .chip {
        font-size: 11.5px; font-weight: 500; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--line-2);
        background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px;
      }
      .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

      main { max-width: 1080px; margin: 0 auto; padding: 10px clamp(16px, 4vw, 40px) 40px; position: relative; }
      .rail { position: absolute; left: calc(clamp(16px, 4vw, 40px) + 21px); top: 30px; bottom: 40px; width: 2px; background: linear-gradient(to bottom, transparent, var(--line-2) 6%, var(--line-2) 94%, transparent); z-index: 0; }

      /* golden-rule lead callout */
      .lead {
        position: relative; z-index: 1; margin: 16px 0 6px; padding: 16px 18px; border-radius: var(--radius);
        background: linear-gradient(120deg, color-mix(in oklch, var(--brand-soft) 60%, var(--surface)), var(--surface));
        border: 1px solid color-mix(in oklch, var(--brand) 40%, var(--line-2));
        font-size: 13.5px; color: var(--ink-2); box-shadow: var(--shadow);
      }
      .lead b, .lead strong { color: var(--brand-ink); }
      .lead .k { display: block; font-family: var(--disp); font-weight: 700; font-size: 14px; color: var(--brand-ink); margin-bottom: 5px; letter-spacing: -0.01em; }

      .phase { display: flex; align-items: center; gap: 14px; margin: 26px 0 14px; padding-left: 62px; position: relative; z-index: 1; }
      .phase span { font-family: var(--disp); font-size: 12px; font-weight: 700; letter-spacing: 0.02em; color: var(--brand-ink); white-space: normal; }
      .phase::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      .phase.hard span { color: var(--ink-2); }

      .node { position: relative; padding-left: 62px; margin-bottom: 12px; z-index: 1; }
      .node > .pin {
        position: absolute; left: 8px; top: 16px; width: 30px; height: 30px; border-radius: 50%;
        background: var(--surface); border: 2px solid var(--brand); color: var(--brand-ink);
        display: grid; place-items: center; font-family: var(--disp); font-weight: 700; font-size: 11px; z-index: 2; box-shadow: var(--shadow);
      }
      .node.k-end > .pin { border-color: var(--end); color: var(--end); }
      .node.k-merge > .pin { border-color: var(--ff); color: var(--ff); }
      .node.k-engine > .pin { border-color: var(--ff); color: var(--ff); }
      .node.k-planned > .pin { border-color: var(--gemini); color: var(--gemini); border-style: dashed; }

      .par { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 760px) { .par { grid-template-columns: 1fr; } }

      .card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow 0.2s, border-color 0.2s; }
      .card:hover { box-shadow: var(--shadow-pop); }
      .card.planned { border-style: dashed; border-color: var(--gemini-bd); background: color-mix(in oklch, var(--gemini-bg) 22%, var(--surface)); }
      .card-h { display: flex; align-items: center; gap: 12px; padding: 13px 15px; cursor: pointer; user-select: none; }
      .card-h .tt { flex: 1; min-width: 0; }
      .card-h h2 { font-family: var(--disp); font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .card-h .step-id { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink-3); background: var(--bg-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
      .planned-pill { font-family: var(--disp); font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gemini); background: var(--gemini-bg); border: 1px solid var(--gemini-bd); border-radius: 999px; padding: 2px 8px; }
      .card-h .sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
      .caret { color: var(--ink-3); transition: transform 0.2s; flex-shrink: 0; }
      .caret svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; display: block; }
      .card.closed .caret { transform: rotate(-90deg); }
      .card.closed .card-b { display: none; }

      .tag {
        font-family: var(--disp); font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; padding: 4px 9px; border-radius: 999px;
        white-space: nowrap; flex-shrink: 0; border: 1px solid; align-self: flex-start; margin-top: 1px;
      }
      .tag[data-p="claude"] { color: var(--claude); background: var(--claude-bg); border-color: var(--claude-bd); }
      .tag[data-p="haiku"] { color: var(--haiku); background: var(--haiku-bg); border-color: var(--haiku-bd); }
      .tag[data-p="gpt"] { color: var(--gpt); background: var(--gpt-bg); border-color: var(--gpt-bd); }
      .tag[data-p="seed"] { color: var(--seed); background: var(--seed-bg); border-color: var(--seed-bd); }
      .tag[data-p="gemini"] { color: var(--gemini); background: var(--gemini-bg); border-color: var(--gemini-bd); }
      .tag[data-p="ff"] { color: var(--ff); background: var(--ff-bg); border-color: var(--ff-bd); }
      .tag[data-p="nex"] { color: var(--nex); background: var(--nex-bg); border-color: var(--nex-bd); }
      .tag[data-p="ce"] { color: var(--ce); background: var(--ce-bg); border-color: var(--ce-bd); }
      .tag[data-p="end"] { color: var(--end); background: var(--end-bg); border-color: var(--end-bd); }
      .tag[data-p="gate"] { color: var(--gate); background: var(--gate-bg); border-color: var(--gate-bd); }
      .tag[data-p="parked"] { color: var(--ink-3); background: var(--bg-2); border-color: var(--line-2); }

      .card-b { padding: 4px 15px 15px; border-top: 1px solid var(--line); }
      .banner { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line-2); border-radius: 10px; padding: 9px 12px; margin: 12px 0 4px; }
      .banner.plan { color: var(--gemini); border-color: var(--gemini-bd); background: color-mix(in oklch, var(--gemini-bg) 35%, var(--surface)); }
      .banner.plan b, .banner.plan strong { color: var(--gemini); }

      .blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
      .blk { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
      .blk-h { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
      .blk-h .d { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
      .blk[data-b="in"] .d { background: var(--c-in); }
      .blk[data-b="out"] .d { background: var(--c-out); }
      .blk[data-b="model"] .d { background: var(--c-model); }
      .blk[data-b="upload"] .d { background: var(--c-upload); }
      .blk[data-b="cap"] .d { background: var(--c-cap); }
      .blk[data-b="fallback"] .d { background: var(--c-fallback); }
      .blk.wide { grid-column: 1 / -1; }
      .blk ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .blk li { position: relative; padding-left: 14px; font-size: 12.5px; color: var(--ink-2); }
      .blk li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); }

      .sheet { max-width: 1080px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 30px; }
      .sheet-h { display: flex; align-items: baseline; gap: 12px; margin: 34px 0 14px; }
      .sheet-h h3 { font-family: var(--disp); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
      .sheet-h .k { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
      .twrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); background: var(--surface); }
      table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 560px; }
      thead th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); position: sticky; top: 0; }
      tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
      tbody tr:last-child td { border-bottom: none; }
      tbody tr:hover td { background: var(--surface-2); }
      td.mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink); white-space: nowrap; }
      td strong { color: var(--ink); }

      body.searching .node.nohit, body.searching .phase, body.searching .lead { display: none; }
      body.searching .par.nohit { display: none; }
      .count { max-width: 1080px; margin: 12px auto -4px; padding: 0 clamp(16px, 4vw, 40px); font-size: 12px; color: var(--ink-3); font-family: var(--mono); display: none; }
      body.searching .count { display: block; }

      footer { max-width: 1080px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 40px) 60px; color: var(--ink-3); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); }
      footer b { color: var(--ink-2); font-weight: 600; }

      .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 13px; font-family: var(--disp); font-weight: 600; opacity: 0; transition: 0.28s cubic-bezier(0.22,1,0.36,1); z-index: var(--z-toast); pointer-events: none; box-shadow: var(--shadow-pop); }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      @media print {
        header, .tools, .toast, .count, .switch { display: none !important; }
        body { background: #fff; color: #000; background-image: none; }
        .card, .twrap, .lead { box-shadow: none; break-inside: avoid; }
        .card-b { display: block !important; }
        .rail { display: none; }
        .node { padding-left: 0; }
        .node > .pin { position: static; display: inline-grid; margin-bottom: 6px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark" id="mark"></div>
        <div>
          <h1 id="ptitle">Template Pipeline</h1>
          <div class="meta" id="pmeta">I/O SPEC</div>
        </div>
      </div>
      <nav class="switch" aria-label="Pipeline">
        <a href="./pipeline-io-spec.html">Video</a>
        <a href="./template-pipeline-io-spec.html" aria-current="true">Template</a>
      </nav>
      <div class="tools">
        <div class="search" id="searchWrap">
          <span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.4-3.4" /></svg></span>
          <input id="q" type="search" placeholder="Filter steps & fields…" aria-label="Filter" />
          <button class="clr" id="qclr" aria-label="Clear" title="Clear">×</button>
        </div>
        <button class="btn icon" id="fold" title="Collapse / expand all" aria-label="Collapse or expand all"></button>
        <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="btn" id="print"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6" /><rect x="3" y="9" width="18" height="8" rx="2" /><path d="M6 14h12v7H6z" /></svg>PDF</button>
      </div>
    </header>

    <div class="legend" id="legend"></div>
    <div class="count" id="count"></div>
    <main id="app"><div class="rail"></div></main>
    <div class="sheet" id="sheets"></div>

    <footer id="foot"></footer>
    <div class="toast" id="toast" role="status"></div>

    <script>
      "use strict";

      const DATA = {
        variant: "template",
        title: "Template Pipeline",
        meta: "I/O SPEC · runs.pipeline = \"template\" · verified 2026-07-15",
        legend: [
          ["claude", "Claude Sonnet 4.6 — template-vision (still, default)"],
          ["gemini", "Gemini — video-vision (PLANNED · Phase 2)"],
          ["haiku", "Claude Haiku 4.5 — template_fill copy"],
          ["gpt", "gpt-image-2 — keyframe + stills"],
          ["seed", "Seedance 2.0 · BytePlus — plain master"],
          ["nex", "Nexrender Cloud — composite"],
          ["ff", "ffmpeg / deterministic engine — no AI"],
          ["end", "endpoint"],
        ],
        stages: [
          { lead: "The template dictates everything.", body: "Layout, timing, look, and every on-screen text / graphic come from the admin's After Effects template. The generated footage is **PLAIN live action** — no baked text, logos, UI or end-cards; the AE template composites those. Template runs are forced `mode:\"automatic\"`, `criticEnabled:false` (no gate ever pauses them) and SKIP the ad-type detector, the 2×2 storyboard, the Critic, and the normal `video` step — so `runs.ad_type` / `hooks` stay null." },

          { phase: "Full run · template_plan → refs → keyframe → fill → images → video → render" },

          { kind: "step", id: "1", p: "claude", title: "template_plan", sub: "the ANALYSIS step · runs FIRST, before any spend · SEES the template",
            blocks: {
              in: ["template preview **poster + sampled frames** — `templates.previewVideoUrl` / `previewPosterUrl` via `getTemplate` (on the templates row, not the run)", "`prompt` · `brandText` · `productBrief` · `tpl.slots` (`planningSlots` withholds AUDIO + brand / decorative image slots)", "poster palette via `dominantPalette` — ground-truth hues"],
              out: ["→ `runs.template_plan` blueprint `{conceptSummary, slots[], visualStyle, onScreenText, audio, visionSource}`", "MIRRORS `visualStyle` → `runs.visual_style` + `runs.ad_style` — how every generated asset matches the template look WITHOUT the ad-type detector", "`visionSource` ∈ poster+frames | poster | text-only"],
              model: ["`createTemplateVisionProvider` → default **Claude Sonnet still-vision** over poster + a dense frame strip · maxTokens 4000 → 6000 retry", "`reconcilePlan` merges the reply onto OUR real slot list keyed by `jobLayerName` — the model's order / count / invented slots are ignored; `fill` decided deterministically"],
              cap: ["`TEMPLATE_VISION_FRAME_COUNT` default 12 (0–16) · frames ~512px jpeg, best-effort"],
              fallback: ["unparseable reply → retry with a larger ceiling · missing poster / frames → visionSource degrades to poster / text-only · palette best-effort"],
            },
            planBanner: "**Planned — Phase 2:** a Gemini video-vision provider watches the RENDERED clip end-to-end (not still frames) and reports where / when each element happens → `visionSource:\"video\"`. Selected by `TEMPLATE_VISION_PROVIDER=gemini` + `GEMINI_API_KEY`; degrades to Claude when absent or the preview URL is dead." },

          { kind: "planned", id: "◇", p: "gemini", planned: true, title: "Gemini video-vision", pTag: "Gemini · planned",
            sub: "Phase 2 upgrade to template_plan — not yet wired",
            blocks: {
              in: ["the rendered template clip `templates.previewVideoUrl` (mp4) — the SAME `system` / `user` blueprint prompt as Claude"],
              out: ["same `templatePlanSchema` JSON blueprint · `visionSource:\"video\"` — richer per-slot `videoScene` / `cameraAction` / `onScreenMoment` from actual motion & timing"],
              model: ["`@google/genai` SDK · Files API upload → poll ACTIVE → `generateContent` (responseMimeType application/json) · `kind:\"video\"`"],
              fallback: ["Gemini path throws (dead ~14d Nexrender preview URL, upload / analyze fail) → falls back to the Claude still provider — Claude stays the guaranteed floor"],
            } },

          { kind: "par", id: "2", cards: [
            { p: "gpt", title: "product_sheet", sub: "SHARED reference agent (not template-specific)",
              blocks: {
                in: ["`product_upload` · `prompt` · `adStyle` (mirrored from the blueprint) · `aspectRatio` (from template metadata)"],
                out: ["asset `product_sheet` + `product_reference_sheets` row"],
                model: ["Claude plan → gpt-image-2 `images.edit` · 4K quality high · `neutralizeCast`"],
                upload: ["`runs/{runId}/product_sheet-{uuid}.webp` (+ provider jpg)"],
              } },
            { p: "gpt", title: "person_sheet", sub: "only when a person is used",
              blocks: {
                in: ["`personBrief` · optional base image (upload or prior sheet)"],
                out: ["asset `person_sheet` + `person_reference_sheets` row — 8 panels"],
                model: ["gpt-image-2 `images.edit` / t2i · 4K quality high"],
                upload: ["`runs/{runId}/person_sheet-{uuid}.webp` (+ provider jpg)"],
              } },
          ] },

          { kind: "step", id: "3", p: "gpt", title: "template_keyframe", sub: "the template's OWN storyboard (no ad-type)",
            blocks: {
              in: ["`template_plan` · `prompt` · `brandText` · `productBrief` · `visualStyle` · `adStyle`", "beats from `deriveTemplateBeats(tpl, plan, clipSeconds)` · product sheet + person ref"],
              out: ["asset `storyboard_sheet` + row (`scenes` = 4 mapped, promptUsed) — reuses the shared surface so `latestStoryboardSheet` / `latestTranscript` feed template_video + template_fill with zero new plumbing", "ALWAYS a fixed **4-panel 2×2** board (`KEYFRAME_PANELS=4`), decoupled from slot count"],
              model: ["Claude script (2 tries → deterministic) → gpt-image-2 · 4K quality high · `neutralizeCast`"],
              upload: ["`runs/{runId}/storyboard_sheet-{uuid}.webp`"],
              cap: ["beats 2..6 condensed to 4 panels · `MIN_BEAT_SEC` 1.5 · `MAX_BEATS` 6"],
              fallback: ["script LLM → deterministic + `toFourScenes` pad · forced code `TEMPLATE_KEYFRAME_FAILED` (a gpt-image error must not reclassify to IMAGE_*)"],
            } },

          { kind: "step", id: "4", p: "haiku", title: "template_fill", sub: "writes every TEXT slot's copy",
            blocks: {
              in: ["`prompt` · `brandText` · template TEXT slots (`currentText`, `charBudget`) · `template_plan` copyIntent · transcript from `latestStoryboardSheet` scenes", "all-media template (no TEXT slots) → returns `[]` early"],
              out: ["→ `runs.template_text_fill` (`TemplateTextFillEntry[]`) · mapped back onto original slots by `jobLayerName`"],
              model: ["**Claude Haiku 4.5** (`backend:\"small\"`) · jsonMode · maxTokens 1500 → 2048 retry"],
              cap: ["`fitToBudget` HARD-enforces each slot's `charBudget` — ceiling = placeholder length × 1.15, min 3; overrun trimmed at a word boundary if ≥ 60% budget else hard cut"],
              fallback: ["missing / blank slot → placeholder · retry once"],
            } },

          { kind: "step", id: "5", p: "gpt", title: "template_images", sub: "one still per fillable content image slot · NEVER hard-fails",
            blocks: {
              in: ["template slots · `template_plan` · `visualStyle` · `adStyle` · `productBrief` · `brandText`", "gate: `imageClass==\"content\"` AND `plan.fill` AND non-empty `imageSubject`", "latest `product_sheet` as the `images.edit` ref — the storyboard sheet is deliberately NOT passed (badges would bleed in)"],
              out: ["`template_image` asset per slot (`meta`: jobLayerName / composition / size / imageSubject)"],
              model: ["gpt-image-2 `images.edit` · size = `gptImageSizeForSlot(w, h)` · quality high · `neutralizeCast` · concurrency 2"],
              upload: ["`runs/{runId}/template_image-{uuid}`"],
              fallback: ["**a failed slot keeps the template's OWN artwork** (pushed to `fellBack`); step still `passed` · idempotent skip of already-persisted slots"],
            } },

          { kind: "step", id: "6", p: "seed", title: "template_video", sub: "the PLAIN Seedance master — no baked text / graphics",
            blocks: {
              in: ["`template` · `template_plan` · `prompt` · brandText / productBrief / visualStyle / personBrief / hasPerson", "`footageSec = templateTotalSeconds(tpl)` · refs (submit order = @Image order): product sheet · **clean-cropped 4-panel keyframe** (`cleanStoryboardRefUrl`) · person face", "beats → `beatsToScenes`"],
              out: ["asset `final_video` + `videos` row (durationSec, hasAudio, providerMeta provider byteplus, taskId / videoPrompt)", "> 15s → several ≤ 15s segments sharing ONE `stableSeed`, persisted as `segment_video`, then `mergeSegmentUrls` into the master"],
              model: ["template-OWNED prompt (`composeVideoBody` LLM 2 tries → deterministic) + `TEMPLATE_VIDEO_NEGATIVES`", "SELF-CONTAINED submit / poll / download — does NOT call the shared `videoBuilder`, so the normal pipeline is untouched"],
              upload: ["`runs/{runId}/final_video-{uuid}.mp4` (+ `segment_video-{uuid}.mp4` for multi)"],
              cap: ["duration = the template's own length · `snapSeedanceDuration` snaps UP to [4,5,6,8,10,12,15] · `MAX_ATTEMPTS` 2 / segment · poll 30 min / 5s · download 120s"],
              fallback: ["prompt LLM → deterministic · forced code `TEMPLATE_VIDEO_FAILED` · idempotent skip of done final / segments"],
            } },

          { kind: "step", id: "7", p: "nex", title: "template_render", sub: "composite clip + copy + stills into the template · self-heal loop", tail: "→ templated_video",
            blocks: {
              in: ["`latestFinalVideoUrl` master clip · `template` snapshot · `template_text_fill` · `template_image` URLs keyed by jobLayerName", "`prepareTemplateClips` → per-slot `template_clip` slices + `template_audio` voiceover · `buildRenderInput` → Nexrender asset list"],
              out: ["asset **`templated_video`** + `videos` row (provider nexrender, nexrenderTemplateId / JobId, composition, voiceover mode, skippedLayers) — persisted ALONGSIDE `final_video`, never replacing it", "best-effort `template_aep` (modified project) · `template_clip` / `template_audio` assets"],
              model: ["**Nexrender Cloud** `POST /api/v2/jobs` (type video, quality full, codec `video_h264_vbr_15mbps`)", "media targeted by `layerIndex` (index) else `layerName` · text via `nx:text-params-set` · sizing `nx:layer-autoscale fit:fill` (name-targeted only)"],
              upload: ["`runs/{runId}/templated_video-{uuid}.mp4` (+ template_clip / template_audio / template_aep) — Nexrender output re-hosted to Supabase immediately (Cloud URL expires ~14d)"],
              cap: ["self-heal loop bounded by `MAX_TEMPLATE_RENDER_ATTEMPTS=4` (1 real attempt + 3 drops) · Nexrender poll 30 min / 5s"],
              fallback: ["on \"couldn't find layers by name (X)\" → `parseMissingLayerName` + `dropAssetsByLayerName` drop X's assets, resubmit fresh · unfilled image slot → template's own art · no template audio layer → `muxVoiceover` over the render"],
            } },

          { kind: "end", id: "OUT", p: "end", plabel: "GET /runs/:id/artifacts", title: "Output", sub: "run status = completed",
            blocks: { out: ["`template_plan` blueprint · productSheet · personSheet? · keyframe storyboardSheet · templateImages[]", "`final_video` (PLAIN master) **and** `templated_video` (the composited ad) side by side"] } },

          { phase: "Re-template shortcut · user swapped the template on a finished ad" },

          { kind: "step", id: "↻", p: "nex", title: "retemplate", sub: "runs.retemplating — reuses the kept master clip + reference sheets",
            blocks: {
              in: ["`POST /runs/:id/retemplate` — new `templateId` · deletes old `template_*` assets"],
              out: ["shorter chain: `template_plan → template_fill → template_images → template_render` (skips keyframe + video — the master clip is reused)"],
              model: ["sequencing in `plan.ts` (`rewindStepForTemplateRegen`, `resumeStepForVideoRegen`, `firstStep`)"],
            } },

          { phase: "Deterministic engine · the what / where / at-which-second source of truth (NO AI)" },

          { kind: "engine", id: "⚙", p: "ff", pTag: "deterministic", title: "The engine", sub: "do NOT rewrite — this is the timing & layout truth",
            blocks: {
              in: ["`introspect.ts` — classifies Nexrender comps + layers into slots · name-vs-index targeting · text ALWAYS by name", "`timeline.ts` — `resolveWindows`: absolute per-slot [start, end] on the main timeline, recursed through the nesting chain", "`aep.ts` — RIFX big-endian parse → real layer names + stacking index (Nexrender v3 `/layers` LIES about both)"],
              out: ["`geometry.ts` — slot classification + sizing + duration (`MIN`/`MAX_TEMPLATE_SEC`, `masterClipSeconds`)", "`beats.ts` — `deriveTemplateBeats` · `slices.ts` / `clips.ts` — per-slot cuts from the master + audio extract", "`render-input.ts` — Nexrender asset list (fills video, omits unfilled image → keeps art, text → placeholder fallback) · `self-heal.ts` — parse + drop offending layers · `library.ts` — templates-table lifecycle + `validateForLibrary`"],
            } },
        ],

        tables: {
          storage: {
            note: "Run assets `runs/{runId}/{kind}-{uuid}.{ext}` · template objects `templates/{templateId}/{kind}-{uuid}.{ext}` (OUTSIDE runs/ so a run-reset never touches them). Admin `.aep` streams straight to Nexrender (never Supabase). Nexrender outputs expire ~14d → re-hosted to Supabase immediately (the library PREVIEW clip is the exception — referenced directly).",
            head: ["Asset", "Path", "Written by"],
            rows: [
              ["product_sheet / person_sheet (ref phase)", "runs/{runId}/{kind}-{uuid}.webp", "shared image agents"],
              ["storyboard_sheet (keyframe)", "runs/{runId}/storyboard_sheet-{uuid}", "template_keyframe"],
              ["template_image", "runs/{runId}/template_image-{uuid}", "template_images"],
              ["final_video (plain master)", "runs/{runId}/final_video-{uuid}.mp4", "template_video"],
              ["segment_video (> 15s)", "runs/{runId}/segment_video-{uuid}.mp4", "template_video"],
              ["template_clip / template_audio", "runs/{runId}/template_clip-{uuid}.mp4 · template_audio-{uuid}.m4a", "clips.ts"],
              ["templated_video (composite)", "runs/{runId}/templated_video-{uuid}.mp4", "template_render"],
              ["template_aep (best-effort)", "runs/{runId}/template_aep-{uuid}.aep", "template_render"],
              ["admin .aep / .zip upload", "→ Nexrender presigned store (NOT Supabase)", "library.createTemplate"],
              ["preview clip", "auto = Nexrender URL direct (~14d) · admin = templates/{id}/preview-{uuid}.mp4", "preview.ts"],
              ["preview poster", "templates/{id}/poster-{uuid}.jpg", "preview.ts"],
            ],
          },
          caps: {
            head: ["Limit", "Value", "Source"],
            rows: [
              ["Template length at upload", "8–60 s (MIN 8 / MAX 60)", "geometry.ts (memory said 8–15; code is 8–60)"],
              ["masterClip length", "templateTotalSeconds = min(durationSec, 60) → split into ≤ 15s segments merged", "geometry.ts"],
              ["MASTER_CLIP_SECONDS", "15 — per-Seedance-clip cap, not whole ad", "geometry.ts"],
              ["Seedance durations", "[4, 5, 6, 8, 10, 12, 15] s · snapped UP", "providers/video.ts"],
              ["TEMPLATE_VISION_FRAME_COUNT", "12 (0–16)", "config/index.ts"],
              ["deriveTemplateBeats", "≥ 2 video slots · MAX_BEATS 6 · MIN_BEAT_SEC 1.5", "beats.ts"],
              ["KEYFRAME_PANELS", "fixed 4 (2×2)", "keyframe/prompt.ts"],
              ["charBudget", "fitToBudget · placeholder × 1.15 · min 3", "fill-text · geometry.ts"],
              ["gptImageSizeForSlot", "÷16 dims · max edge 3840 · MAX_SLOT_ASPECT 3:1 · MAX_TOTAL_PX 8.29M", "geometry.ts"],
              ["template_images concurrency", "2", "images/index.ts"],
              ["template_video attempts", "2 / segment", "video/index.ts"],
              ["MAX_TEMPLATE_RENDER_ATTEMPTS", "4 (1 real + 3 drops)", "template/index.ts"],
              ["MAX_VIDEO_SLOTS", "60", "library.ts"],
              ["Seedance / Nexrender poll", "30 min timeout · 5s interval", "config/index.ts"],
              ["TEMPLATE_STEP_ENABLED", "false by default — POST /runs rejects pipeline:template until on", "config/index.ts"],
            ],
          },
          fallbacks: {
            head: ["Fallback", "Behavior", "Source"],
            rows: [
              ["template_images fell-back", "a failed slot keeps the template's own artwork; the step still passes", "images/index.ts"],
              ["unfilled image slot at render", "omitted from the Nexrender asset list → template's own art", "render-input.ts"],
              ["self-heal", "\"couldn't find layers by name (X)\" → parseMissingLayerName + dropAssetsByLayerName, resubmit fresh · bounded by 4 attempts", "self-heal.ts · template/index.ts"],
              ["vision provider", "gemini → claude when no GEMINI_API_KEY; the gemini stub throws if forced (until Phase 2)", "providers/template-vision"],
              ["snapSeedanceDuration", "snap UP — a longer clip is trimmed by AE; a shorter one freezes / cuts audio", "providers/video.ts"],
              ["layer targeting", "by layerIndex (media, pre-sized to the placeholder comp) vs layerName (text + renamed media, gets autoscale)", "render-input · introspect"],
              ["template_video / keyframe prompt", "LLM → deterministic — never fails the step on a prompt hiccup", "video · keyframe"],
              ["voiceover routing", "no template audio layer → muxed over the render (the usual case)", "clips.ts · template/index.ts"],
              ["retemplate shortcut", "reuses the kept master clip + reference sheets — only re-plans, re-fills, re-images, re-renders", "routes/runs.ts · plan.ts"],
              ["forced error codes", "template_keyframe / template_video use runFailureWithCode so TEMPLATE_* survives for rewindStepForTemplateRegen", "lib/run-failure.ts"],
            ],
          },
        },
        foot: "Read-only spec · click a step to collapse · press <b>/</b> to filter · <b>PDF</b> prints all sections expanded. The <b>template dictates</b> layout / timing / look / text; the generated footage is PLAIN live action that Nexrender composites into the AE template. Runs are forced <b>automatic</b> + critic-off and never run the ad-type detector. The <span style=\"color:var(--gemini)\">Gemini video-vision</span> node is <b>PLANNED (Phase 2)</b> — today template_plan uses Claude still-vision. Verified against source on 2026-07-15.",
      };

      /* ============================== render ============================== */
      const app = document.getElementById("app");
      const CARET = '<span class="caret"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>';
      const BLK_ORDER = ["in", "out", "model", "upload", "cap", "fallback"];
      const BLK_LABEL = { in: "In", out: "Out", model: "Model", upload: "Upload", cap: "Cap", fallback: "Fallback" };
      const P_NAME = { claude: "Claude 4.6", haiku: "Haiku 4.5", gpt: "gpt-image-2", seed: "Seedance 2.0", gemini: "Gemini", nex: "Nexrender", ff: "ffmpeg", ce: "CE.SDK", end: "endpoint", gate: "gate", parked: "parked" };
      const P_VAR = { claude: "--claude", haiku: "--haiku", gpt: "--gpt", seed: "--seed", gemini: "--gemini", nex: "--nex", ff: "--ff", ce: "--ce", end: "--end", gate: "--gate", parked: "--ink-3" };
      const closed = new Set();

      const fmt = (s) => s
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

      function blocksHTML(b) {
        if (!b) return "";
        let out = "";
        for (const key of BLK_ORDER) {
          const rows = b[key];
          if (!rows || !rows.length) continue;
          const wide = key === "model" || rows.some((r) => r.length > 90) ? " wide" : "";
          out += `<div class="blk${wide}" data-b="${key}"><div class="blk-h"><span class="d"></span>${BLK_LABEL[key]}</div><ul>${rows.map((r) => `<li>${fmt(r)}</li>`).join("")}</ul></div>`;
        }
        return `<div class="blocks">${out}</div>`;
      }

      function cardHTML(c, idx) {
        const idPill = c.id ? `<span class="step-id">${c.id}</span>` : "";
        const plannedPill = c.planned ? `<span class="planned-pill">planned</span>` : "";
        const tail = c.tail ? ` <span class="step-id">${fmt(c.tail)}</span>` : "";
        const tag = c.p ? `<span class="tag" data-p="${c.p}">${c.pTag || P_NAME[c.p] || ""}</span>` : "";
        const head = `<div class="card-h"><div class="tt"><h2>${idPill}${fmt(c.title)}${plannedPill}${tail}</h2>${c.sub ? `<div class="sub">${fmt(c.sub)}</div>` : ""}</div>${tag}${CARET}</div>`;
        const plabel = c.plabel ? `<div class="banner">${` <code>${c.plabel}</code>`}</div>` : "";
        const planB = c.planBanner ? `<div class="banner plan">${fmt(c.planBanner)}</div>` : "";
        const isClosed = closed.has(idx) ? " closed" : "";
        return `<article class="card${c.planned ? " planned" : ""}${isClosed}" data-idx="${idx}">${head}<div class="card-b">${plabel}${blocksHTML(c.blocks)}${planB}</div></article>`;
      }

      function render() {
        let html = '<div class="rail"></div>';
        DATA.stages.forEach((st, i) => {
          if (st.lead) { html += `<div class="lead"><span class="k">${fmt(st.lead)}</span>${fmt(st.body || "")}</div>`; return; }
          if (st.phase) { html += `<div class="phase${st.hard ? " hard" : ""}"><span>${fmt(st.phase)}</span></div>`; return; }
          if (st.kind === "par") {
            html += `<div class="node" data-idx="${i}"><span class="pin">${st.id || ""}</span><div class="par">${st.cards.map((c, j) => cardHTML(c, `${i}.${j}`)).join("")}</div></div>`;
            return;
          }
          html += `<div class="node k-${st.kind} ${st.planned ? "k-planned" : ""}" data-idx="${i}"><span class="pin">${st.id || ""}</span>${cardHTML(st, `${i}`)}</div>`;
        });
        app.innerHTML = html;
      }

      function tableHTML(t) {
        return `<div class="twrap"><table><thead><tr>${t.head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i === 1 && t === DATA.tables.storage ? "mono" : ""}">${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      }
      function renderSheets() {
        const T = DATA.tables;
        document.getElementById("sheets").innerHTML =
          `<div class="sheet-h"><h3>Upload &amp; storage</h3><span class="k">where every file lands</span></div>${T.storage.note ? `<div class="banner" style="margin:0 0 12px">${fmt(T.storage.note)}</div>` : ""}${tableHTML(T.storage)}` +
          `<div class="sheet-h"><h3>Caps &amp; limits</h3><span class="k">the ceilings</span></div>${tableHTML(T.caps)}` +
          `<div class="sheet-h"><h3>Fallbacks</h3><span class="k">how it degrades, not dies</span></div>${tableHTML(T.fallbacks)}`;
      }

      function renderLegend() {
        document.getElementById("legend").innerHTML = `<span class="lbl">Legend</span>` +
          DATA.legend.map(([k, label]) => `<span class="chip"><span class="dot" style="background:var(${P_VAR[k]})"></span>${label}</span>`).join("");
      }

      document.getElementById("ptitle").textContent = DATA.title;
      document.getElementById("pmeta").textContent = DATA.meta;
      document.getElementById("foot").innerHTML = DATA.foot;
      document.getElementById("mark").innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>';

      renderLegend();
      render();
      renderSheets();

      const themeBtn = document.getElementById("theme");
      const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      function setTheme(t) { document.documentElement.dataset.theme = t; themeBtn.innerHTML = t === "dark" ? SUN : MOON; }
      const urlTheme = new URLSearchParams(location.search).get("theme");
      setTheme(urlTheme === "dark" || urlTheme === "light" ? urlTheme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

      const foldBtn = document.getElementById("fold");
      const FOLD = '<svg viewBox="0 0 24 24"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg>';
      const UNFOLD = '<svg viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>';
      let allClosed = false;
      foldBtn.innerHTML = FOLD;
      foldBtn.onclick = () => {
        allClosed = !allClosed;
        document.querySelectorAll(".card").forEach((c) => { c.classList.toggle("closed", allClosed); allClosed ? closed.add(c.dataset.idx) : closed.delete(c.dataset.idx); });
        foldBtn.innerHTML = allClosed ? UNFOLD : FOLD;
      };

      app.addEventListener("click", (e) => {
        const h = e.target.closest(".card-h");
        if (!h) return;
        const card = h.closest(".card");
        card.classList.toggle("closed");
        card.classList.contains("closed") ? closed.add(card.dataset.idx) : closed.delete(card.dataset.idx);
      });

      const q = document.getElementById("q");
      const qWrap = document.getElementById("searchWrap");
      const countEl = document.getElementById("count");
      function applySearch() {
        const term = q.value.trim().toLowerCase();
        qWrap.classList.toggle("has", term.length > 0);
        if (!term) { document.body.classList.remove("searching"); return; }
        document.body.classList.add("searching");
        let hits = 0;
        document.querySelectorAll(".node").forEach((node) => {
          let nodeHit = false;
          node.querySelectorAll(".card").forEach((card) => {
            if (card.textContent.toLowerCase().includes(term)) { nodeHit = true; hits++; card.classList.remove("closed"); }
          });
          node.classList.toggle("nohit", !nodeHit);
          node.querySelectorAll(".par").forEach((p) => p.classList.toggle("nohit", !nodeHit));
        });
        countEl.textContent = hits ? `${hits} step${hits === 1 ? "" : "s"} match "${q.value.trim()}"` : `no steps match "${q.value.trim()}"`;
      }
      q.addEventListener("input", applySearch);
      document.getElementById("qclr").onclick = () => { q.value = ""; applySearch(); q.focus(); };
      addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
        if (e.key === "Escape" && document.activeElement === q) { q.value = ""; applySearch(); q.blur(); }
      });

      const toast = document.getElementById("toast");
      let tt;
      document.getElementById("print").onclick = () => {
        toast.textContent = "Opening print dialog…"; toast.classList.add("show");
        clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 1600);
        setTimeout(() => print(), 120);
      };
    </script>
  </body>
</html>
